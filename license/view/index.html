<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
:root { color-scheme: light; }
body { margin: 0; color: #1e293b; font-family: Arial, Tahoma, sans-serif; }
body.viewer-page { padding: 5rem 1.5rem; }
.status-badge { padding: .25rem 1rem; border-radius: .375rem; width: max-content; }
.tone-success { background: #bbf7d0; color: #14532d; }
.tone-danger { background: #fecaca; color: #7f1d1d; }
.tone-warning { background: #fed7aa; color: #7c2d12; }
.tone-neutral { background: #e2e8f0; color: #334155; }
.field-value { min-height: 1.5em; overflow-wrap: anywhere; }
.table-scroll { width: 100%; overflow-x: auto; }
.data-table { width: 100%; }
.data-table td, .data-table th { vertical-align: top; }
.data-table td { min-width: 7rem; max-width: 24rem; overflow-wrap: anywhere; }
.error-page { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; text-align: center; background: white; }
.error-code { margin: 0 0 .75rem; font-size: 44px; font-weight: 700; line-height: 1.1; color: #111; }
.error-text { margin: 0; font-size: 18px; color: #333; }
@media (max-width: 639px) {
  body.viewer-page { padding: 1.5rem 1rem; }
  .viewer-header { gap: .75rem; }
  .viewer-header .header-image { max-width: 29%; height: auto; max-height: 4rem; object-fit: contain; }
  .viewer-header > div { text-align: center; font-size: 1rem; }
  .summary-dates { flex-wrap: wrap; }
  .info-grid { row-gap: 1.5rem; }
}

.viewer-page img { max-width: 100%; }
.w-36 { width: 9rem; }
#viewer { max-width: 64rem; margin-inline: auto; }
.viewer-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.viewer-header .header-image { height: 4rem; max-width: 28%; object-fit: contain; }
.info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
table { border-collapse: collapse; }
td, th { padding: .75rem; }
#app[data-state="loading"]::before { content: ""; display: block; width: 2rem; height: 2rem; margin: 30vh auto; border: 3px solid #e2e8f0; border-top-color: #0d9488; border-radius: 50%; animation: viewer-spin .8s linear infinite; }
@keyframes viewer-spin { to { transform: rotate(360deg); } }
@media (max-width: 639px) { .info-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    (() => {
      const path = location.pathname;
      const route = path.match(/^(.*?)\/license\/view(?:\/|$)/);
      const base = route ? route[1] + '/' : new URL('./', location.href).pathname;
      function boot(directory) {
        window.viewerBase = directory;
        const script = document.createElement('script');
        script.type = 'module';
        script.src = new URL('js/viewer-ede53ddd8060.js', directory).href;
        script.onerror = () => {
          const parent = new URL('../', directory);
          if (parent.href !== directory.href) boot(parent);
        };
        document.body.append(script);
      }
      boot(new URL(base, location.origin));
    })();
  </script>
</body>
</html>
